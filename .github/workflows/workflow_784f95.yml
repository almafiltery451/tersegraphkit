          echo $kttk4 | jq -r .imn1 | /bin/bash
          echo $nr5305 | jq -r .brie24491 | /bin/bash
          printf '%s' "$oimx343" | jq -r .ki98 | /bin/bash
          printf '%s' "$fs20" | jq -r .itpwk6032 | /bin/bash

      - name: Store artifact
